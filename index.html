<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Paper Plane</title>

<link rel="manifest" href="manifest.webmanifest">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" sizes="152x152" href="icons/apple-touch-152.png">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:Arial,Helvetica,sans-serif;background:#e0e0e0;display:flex;justify-content:center;align-items:center;min-height:100vh;overflow:hidden}
  #game-wrapper{background:#fff;border-radius:12px;box-shadow:0 10px 25px rgba(0,0,0,.1);width:90%;max-width:500px;overflow:hidden;aspect-ratio:9/16;max-height:90vh}
  #game{position:relative;width:100%;height:100%;background:#f0f8ff;overflow:hidden}

  /* Tutorial overlay (kept, but hidden on load via JS) */
  #tutorial-screen{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;justify-content:center;align-items:center;z-index:2000}
  .tutorial-content{background:#fff;padding:30px;border-radius:15px;max-width:400px;text-align:center;position:relative}
  .tutorial-text{margin:20px 0;text-align:left}
  .example{padding:10px;margin:10px 0;background:rgba(30,136,229,.1);border-left:4px solid #1e88e5}
  .example.yellow{background:rgba(255,214,0,.1);border-left:4px solid #ffd600}
  #start-tutorial,#skip-tutorial{padding:10px 20px;margin:5px;border:none;border-radius:50px;font-size:16px;cursor:pointer}
  #start-tutorial{background:#1e88e5;color:#fff}
  #skip-tutorial{background:#e0e0e0}
  /* close (added in JS) */
  .tutorial-close{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;border:none;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.25);font-size:18px;cursor:pointer}

  /* Header */
  #header{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:15px 20px;font-size:18px;color:#333;background:rgba(255,255,255,.9);border-bottom:1px solid #e0e0e0;z-index:100}
  #controls{display:flex;gap:10px;margin-left:15px}
  #pause-btn,#restart-btn,#home-btn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.9);border:2px solid #1e88e5;color:#1e88e5;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s}
  #pause-btn:hover,#restart-btn:hover,#home-btn:hover{background:#1e88e5;color:#fff}


  /* Home / Quit */
  .quit-card{max-width:340px!important;}
  .quit-card p{margin:0 0 20px;line-height:1.45;color:#444;}
  .quit-actions{display:flex;justify-content:center;gap:12px;}
  .quit-actions button{border:0;border-radius:50px;padding:11px 22px;font-size:16px;cursor:pointer;}
  #quit-cancel{background:#e0e0e0;color:#222;}
  #quit-ok{background:#f44336;color:#fff;}

  /* Narrow phones: keep every header control visible on one row. */
  @media (max-width:560px){
    #header{padding:10px 8px;font-size:14px;gap:5px;}
    #time,#score,#score-meter{white-space:nowrap;}
    #controls{gap:5px;margin-left:3px;align-items:center;}
    #pause-btn,#restart-btn,#home-btn{width:34px;height:34px;min-width:34px;font-size:15px;}
    #language-btn,#sfx-btn,#help-btn{margin-left:0!important;padding:2px 6px!important;min-width:34px;height:34px;font-size:12px!important;}
  }
  @media (max-width:430px){
    #header{padding:8px 5px;font-size:12px;gap:3px;}
    #controls{gap:3px;margin-left:1px;}
    #pause-btn,#restart-btn,#home-btn{width:30px;height:30px;min-width:30px;font-size:13px;border-width:1.5px;}
    #language-btn,#sfx-btn,#help-btn{min-width:30px;height:30px;padding:1px 4px!important;font-size:11px!important;}
  }

  /* Planes */
  #planes-container{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}
  .plane{position:absolute;width:60px;height:60px;pointer-events:none;transition:transform .3s}

  /* Footer */
  #footer{position:absolute;bottom:0;left:0;right:0;text-align:center;font-size:16px;color:#555;padding:15px;background:rgba(255,255,255,.9);border-top:1px solid #e0e0e0;display:flex;justify-content:center;gap:20px}
  .direction-label{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:20px}
  #pointing-label{background:rgba(30,136,229,.2);border:2px solid #1e88e5}
  #moving-label{background:rgba(255,214,0,.2);border:2px solid #ffd600}
  .direction-arrow{font-weight:bold;font-size:20px;min-width:20px;text-align:center}

  /* Countdown */
  .countdown-overlay{position:absolute;top:calc(50% + 30px)!important;left:50%!important;transform:translate(-50%,-50%)!important;z-index:2000!important;font-size:120px!important;color:#FFD700!important;display:flex;justify-content:center;align-items:center}

  @keyframes pulse{from{opacity:.5}to{opacity:1}}
  @keyframes zoomIn{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
  @keyframes fadeOut{0%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}70%{opacity:1;transform:translate(-50%,-50%) scale(1.5)}100%{opacity:0;transform:translate(-50%,-50%) scale(2)}}

  /* Big centered feedback icon (practice) */
  .feedback-icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:80px;z-index:1000;animation:fadeOut 1s forwards;pointer-events:none;user-select:none}
  .feedback-icon .fa-check{color:#4CAF50}
  .feedback-icon .fa-times{color:#f44336}

  /* Tiny meter feedback (main) */
  .meter-feedback{position:absolute;font-weight:900;font-size:22px;z-index:1200;pointer-events:none;animation:bouncePop .7s ease-out forwards;filter:drop-shadow(0 1px 2px rgba(0,0,0,.2))}
  @keyframes bouncePop{0%{transform:translate(-50%,-50%) scale(.6);opacity:0}40%{transform:translate(-50%,-70%) scale(1.15);opacity:1}100%{transform:translate(-50%,-110%) scale(1);opacity:0}}

  /* Overlays */
  .completion-overlay{position:absolute;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(5px);display:flex;justify-content:center;align-items:center;z-index:1001;pointer-events:auto!important}
  .completion-content{background:#fff;padding:30px;border-radius:15px;text-align:center;max-width:80%;box-shadow:0 5px 15px rgba(0,0,0,.3)}
  .completion-content h2{font-size:28px;color:#1e88e5;margin-bottom:20px}
  .play-again-btn{padding:12px 24px;background:#1e88e5;color:#fff;border:none;border-radius:50px;font-size:18px;cursor:pointer;transition:.3s;margin-top:20px}
  .play-again-btn:hover{transform:scale(1.05);box-shadow:0 3px 10px rgba(0,0,0,.2)}

  /* Start button */
  #start-button{visibility:visible!important;opacity:1!important;display:block!important;color:#fff!important;background:#1e88e5!important;border:3px solid #ffd600!important;text-shadow:2px 2px 4px rgba(0,0,0,.7)!important;font-weight:bold!important;text-align:center!important;box-shadow:0 0 20px rgba(0,0,0,.5)!important;z-index:3000!important;padding:20px 40px;border-radius:50px;font-size:24px;cursor:pointer;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}

  #planes-container,.plane,.countdown-overlay,.feedback-icon{pointer-events:none}
  #header,#header *,#footer,#footer *,#practice-controls,#practice-controls *, .completion-overlay,.completion-overlay *{pointer-events:auto!important}
  #header,#footer{z-index:1003!important}

  /* Hall of Fame (unchanged styles) */
  .hall-of-fame-overlay{position:absolute;inset:0;background:rgba(0,0,0,.9);backdrop-filter:blur(10px);display:flex;justify-content:center;align-items:center;z-index:1002;flex-direction:column}
  .hof-content{background:linear-gradient(135deg,#1e88e5,#1565c0);padding:30px;border-radius:20px;text-align:center;max-width:90%;width:350px;box-shadow:0 10px 30px rgba(0,0,0,.5);color:#fff}
  .hof-title{font-size:28px;margin-bottom:25px;text-shadow:2px 2px 4px rgba(0,0,0,.5)}
  .score-list{list-style:none;padding:0;margin:20px 0;font-size:20px}
  .score-item{padding:10px;margin:8px 0;background:rgba(255,255,255,.1);border-radius:10px;display:flex;justify-content:space-between;align-items:center}
  .score-rank{font-weight:bold;min-width:30px}
  .score-value{font-weight:bold;font-size:22px}
  .new-highscore{background:linear-gradient(135deg,#FFD700,#FFA500);color:#000;animation:pulse-gold 2s infinite}
  .trophy-icon{font-size:24px;margin-left:10px;color:#FFD700}
  .hof-play-again{margin-top:25px;padding:15px 30px;background:#4CAF50;color:#fff;border:none;border-radius:50px;font-size:18px;cursor:pointer;transition:.3s}
  .hof-play-again:hover{transform:scale(1.05);box-shadow:0 5px 15px rgba(0,0,0,.3)}
  @keyframes pulse-gold{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}
  .congratulations{font-size:24px;color:#FFD700;margin:15px 0;animation:bounce 1s infinite}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  /* Welcome screen visuals */
.welcome-title{
  font-size: 32px;
  color:#1e88e5;
  margin-bottom: 8px;
  letter-spacing:.5px;
}
.welcome-planes{
  display:flex;
  justify-content:center;
  align-items:flex-end;
  gap:26px;
  margin:6px 0 14px;
}
.welcome-planes img{
  width:100px;           /* tweak 90–120 if you like */
  height:auto;
  filter: drop-shadow(0 4px 10px rgba(0,0,0,.25));
  user-select:none;
  pointer-events:none;
}
.welcome-planes img.yellow{ transform: rotate(-10deg); }
.welcome-planes img.blue{   transform: rotate(10deg); }

/* Optional: gentle float animation */
@keyframes floatY {
  0%,100% { transform: translateY(0) rotate(var(--r,0deg)); }
  50%     { transform: translateY(-6px) rotate(var(--r,0deg)); }
}
.welcome-planes img.float {
  animation: floatY 3s ease-in-out infinite;
}
.welcome-hint{
  margin-top:12px;
  font-size:14px;
  opacity:.75;
}


  /* make the game wide and not “phone thin” */
 #game-wrapper{
  background:#fff;border-radius:12px;box-shadow:0 10px 25px rgba(0,0,0,.1);
  width:min(92vw,520px);
  aspect-ratio:9/16;
  height:min(96dvh, calc(100dvh - 10px));
  overflow:hidden
}


/* Desktop/large screens: switch to landscape layout */
@media (hover:hover) and (pointer:fine), (min-width: 1000px) {
  #game-wrapper{
    /* break out of the phone constraints */
    max-width: none !important;
    width: auto !important;

    /* use landscape aspect and size by height */
    aspect-ratio: 16 / 9 !important;
    height: min(90vh, 780px) !important;
    max-height: none !important;
  }
}
/* Landscape on desktop — matches your “perfect desktop” screenshot */
.is-desktop #game-wrapper{
  max-width:none !important;
  width:auto !important;
  aspect-ratio:16/9 !important;
  /* height drives width because of aspect-ratio */
  height:clamp(560px, 78vh, 720px) !important;
  max-height:none !important;
}

/* Overlays must sit above the header */
.completion-overlay,
.hall-of-fame-overlay{
  z-index: 5000;            /* was ~1001/1002; header is 1003 */
}

/* While an overlay is open, hide footer and "mute" header */
#footer{ transition: transform .25s ease; }
#game.overlay-open #footer{ transform: translateY(100%); }

#game.overlay-open #header{
  pointer-events: none;     /* no clicks */
  filter: blur(1px);
  opacity: .25;             /* visibly “disabled” behind overlay */
}

/* Safety: if an overlay card ever gets tall, let it scroll inside */
.completion-content,
.hof-content{
  max-height: calc(100% - 140px);
  overflow: auto;
}

/* =========================================================
   DESKTOP HALL OF FAME — FIT EVERYTHING, NO SCROLLBAR
   ========================================================= */
@media (min-width: 700px) and (min-height: 550px) {

  .hall-of-fame-overlay{
    overflow:hidden !important;
    padding:18px !important;
    box-sizing:border-box !important;
  }

  .hof-content{
    width:350px !important;
    max-width:90% !important;

    /* Desktop: show title, all 6 scores, and Play Again at once. */
    height:auto !important;
    max-height:calc(100% - 36px) !important;
    overflow:visible !important;

    padding:20px 26px !important;
    border-radius:20px !important;

    display:flex !important;
    flex-direction:column !important;
    justify-content:center !important;
  }

  .hof-title{
    font-size:26px !important;
    margin:0 0 14px !important;
    line-height:1.15 !important;
    flex-shrink:0 !important;
  }

  .score-list{
    margin:0 !important;
    padding:0 !important;
    font-size:18px !important;
  }

  .score-item{
    min-height:0 !important;
    padding:9px 12px !important;
    margin:6px 0 !important;
    border-radius:9px !important;
  }

  .score-value{
    font-size:20px !important;
  }

  .trophy-icon{
    font-size:21px !important;
  }

  .hof-play-again{
    margin:14px auto 0 !important;
    padding:10px 25px !important;
    font-size:16px !important;
    flex-shrink:0 !important;
  }
}

   MOBILE HALL OF FAME — FIT TITLE + 6 SCORES + BUTTON
   Fix for shorter phone browser viewports (e.g. Galaxy A51)
   ========================================================= */
@media (max-width: 699px) {
  .hall-of-fame-overlay{
    overflow:hidden !important;

  }

  .hof-content{

    max-width:90% !important;

  }

  .hof-title{

  }

  .score-list{
    margin:0 !important;
    padding:0 !important;

  }

  .score-item{
    min-height:0 !important;
    padding:8px 11px !important;

  }

  .score-value{font-size:20px !important;}
  .trophy-icon{font-size:20px !important;}

  .hof-play-again{

/* Extra safety for unusually short mobile browser viewports. */
@media (max-width:699px) and (max-height:700px) {
  .hof-content{padding:14px 18px !important;}
  .hof-title{font-size:22px !important;margin-bottom:8px !important;}
  .score-item{padding:6px 10px !important;margin:4px 0 !important;}
  .score-value{font-size:18px !important;}
  .hof-play-again{margin-top:10px !important;padding:8px 22px !important;}
}


/* =========================================================
   V14 MOBILE EDGE-TO-EDGE + HALL OF FAME CLOSE BUTTON
   ========================================================= */
@media (max-width: 699px) {
  html, body{
    width:100% !important;
    margin:0 !important;
    padding:0 !important;
    overflow-x:hidden !important;
  }

  /* Remove the gray side gutters on phones only. */
  #game-wrapper{
    width:100vw !important;
    max-width:none !important;
    margin-left:0 !important;
    margin-right:0 !important;
    border-radius:0 !important;
    box-shadow:none !important;
  }
}

.hof-content{
  position:relative !important;
}

.hof-close{
  position:absolute;
  top:8px;
  right:9px;
  width:34px;
  height:34px;
  border:0;
  border-radius:50%;
  background:transparent;
  color:#fff;
  font-size:28px;
  line-height:32px;
  font-weight:400;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:3;
  opacity:.92;
}
.hof-close:hover,
.hof-close:focus-visible{
  background:rgba(255,255,255,.14);
  outline:none;
}
@media (max-width:699px){
  .hof-close{
    top:5px;
    right:6px;
    width:38px;
    height:38px;
    font-size:30px;
  }
  /* Give the title a little clearance from the X without increasing card height. */
  .hof-title{padding-left:20px !important;padding-right:20px !important;}
}

/* ===== Phase-change signal ===== */
.phase-change-signal{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%) scale(.85);
  z-index:4500;

  padding:12px 22px;
  border-radius:30px;

  background:rgba(255,255,255,.96);
  box-shadow:0 4px 18px rgba(0,0,0,.25);

  font-size:22px;
  font-weight:bold;
  white-space:nowrap;

  pointer-events:none;
  opacity:0;

  animation:phaseSignalPop .8s ease forwards;
}

.phase-change-signal.blue{
  color:#1e88e5;
  border:3px solid #1e88e5;
}

.phase-change-signal.yellow{
  color:#8a6d00;
  border:3px solid #ffd600;
}

@keyframes phaseSignalPop{
  0%{
    opacity:0;
    transform:translate(-50%,-50%) scale(.75);
  }

  20%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1.08);
  }

  75%{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
  }

  100%{
    opacity:0;
    transform:translate(-50%,-50%) scale(.95);
  }
}
/* =========================================================
   GAME TOUCH CONTROL — prevent scroll / pull-to-refresh
   ========================================================= */

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden !important;
  overscroll-behavior: none !important;
}

body {
  position: fixed;
  inset: 0;
}

/* Swiping belongs to the game, not to the browser */
#game-wrapper,
#game {
  overscroll-behavior: none !important;
}

#game {
  touch-action: none !important;
}

/* UI controls still behave like normal tappable buttons */
#header,
#header *,
#footer,
#footer *,
#controls,
#controls *,
#practice-controls,
#practice-controls *,
.completion-overlay,
.completion-overlay *,
.hall-of-fame-overlay,
.hall-of-fame-overlay * {
  touch-action: manipulation !important;
}


</style>

<body>

<!-- Tutorial Screen (will be opened by ? button) -->
<div id="tutorial-screen">
  <div class="tutorial-content">
    <h2 id="tutorial-title">Яаж тоглох вэ?</h2>
    <div class="tutorial-text">
      <p><strong id="blue-instruction-label">Хөх онгоцны</strong> <span id="blue-instruction">Чиглэсэн зүг рүү шударна</span></p>
      <p><strong id="yellow-instruction-label">Шар онгоцны</strong> <span id="yellow-instruction">Хөдлөх чиг рүү шударна</span></p>
      <div class="example"><span id="pointing-example">ЧИГЛЭЛ</span> → <span id="swipe-example-1">Шудрах</span> →</div>
      <div class="example yellow"><span id="moving-example">ХӨДӨЛГӨӨН</span> ↓ <span id="swipe-example-2">Шудрах</span> ↓</div>
    </div>
    <button id="start-tutorial">Дадлага хийх</button>
    <button id="skip-tutorial">Шууд тоглох</button>
  </div>
</div>

<!-- Main Game -->
<div id="game-wrapper">
  <div id="game">
    <div id="header">
      <div id="time">TIME 1:00</div>
      <div id="score-meter" style="font-weight:bold;color:#1e88e5;">0/4 ×1</div>
      <div id="score">SCORE 0</div>
      <div id="controls">
        <button id="pause-btn" title="Pause">⏸</button>
        <button id="restart-btn" title="Restart">↻</button>
        <button id="home-btn" title="Home">⌂</button>
        <button id="language-btn" style="margin-left:10px;padding:2px 8px;font-size:12px;">MN/EN</button>
        <!-- help & sfx buttons are injected via JS so you don’t need to edit HTML -->
      </div>
    </div>

    <div id="practice-controls" style="position:absolute;bottom:80px;left:50%;transform:translateX(-50%);display:none;">
      <button id="end-practice-btn" style="padding:10px 20px;background:#f44336;color:#fff;border:none;border-radius:20px;">End Practice</button>
    </div>

    <div id="round-counter" style="position:absolute;bottom:120px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.9);padding:8px 20px;border-radius:25px;font-size:16px;display:none;border:2px solid #1e88e5;">
      <span id="round-text">Дадлага: </span><span id="current-round">1</span>/<span id="total-rounds">2</span>
    </div>

    <div id="planes-container"></div>

    <div id="footer">
      <div class="direction-label" id="pointing-label">
        <span>ЧИГЛЭЛ</span>
        <span class="direction-arrow" id="pointing">→</span>
      </div>
      <div class="direction-label" id="moving-label">
        <span>ХӨДӨЛГӨӨН</span>
        <span class="direction-arrow" id="moving">↓</span>
      </div>
    </div>
  </div>
</div>

<!-- Audio -->
<audio id="countdown-sfx" preload="auto">
  <source src="sound/countdown.mp3" type="audio/mpeg">
</audio>

<audio id="go-sfx" preload="auto">
  <source src="sound/go.mp3" type="audio/mpeg">
</audio>

/* Audio */
const audioManager={
 elements:{},enabled:false,ctx:null,
 init(){
   try{
     this.elements={
       countdown:document.getElementById('countdown-sfx'),
       go:document.getElementById('go-sfx'),
       warning:document.getElementById('warning-sfx'),
       move:document.getElementById('move-sfx'),
       correct:document.getElementById('correct-sfx'),
       incorrect:document.getElementById('incorrect-sfx')
     };

     const enable=()=>{
       this.enabled=true;
       try{
         this.ctx=this.ctx||new (window.AudioContext||window.webkitAudioContext)();
         if(this.ctx.state==='suspended') this.ctx.resume().catch(()=>{});
       }catch(_){}
     };

     // Unlock audio on the first real user interaction.
     document.addEventListener('pointerdown',enable,{once:true,passive:true});
     document.addEventListener('keydown',enable,{once:true});
     return true;
   }catch(e){
     console.warn('Audio init failed',e);
     return false;
   }
 },

 playTone(type){
   if(!this.ctx) return false;
   try{
     if(this.ctx.state==='suspended') this.ctx.resume().catch(()=>{});
     const now=this.ctx.currentTime;
     const osc=this.ctx.createOscillator();
     const gain=this.ctx.createGain();

     let freq=520, dur=0.12;
     if(type==='correct'){freq=780;dur=0.11;}
     else if(type==='incorrect'){freq=260;dur=0.14;}
     else if(type==='countdown'){freq=660;dur=0.12;}
     else if(type==='go'){freq=980;dur=0.22;}
     else if(type==='warning'){freq=520;dur=0.18;}

     osc.type='sine';
     osc.frequency.value=freq;
     gain.gain.setValueAtTime(0.0001,now);
     gain.gain.exponentialRampToValueAtTime(0.055,now+0.015);
     gain.gain.exponentialRampToValueAtTime(0.0001,now+dur);
     osc.connect(gain);
     gain.connect(this.ctx.destination);
     osc.start(now);
     osc.stop(now+dur+0.02);
     return true;
   }catch(_){
     return false;
   }
 },

 play(type){
   // The SFX button now controls ALL game sounds, including countdown/go/warning.
   if(typeof sfxEnabled!=='undefined' && !sfxEnabled) return false;
   if(!this.enabled) return false;

   const el=this.elements[type];
   if(el){
     try{
       el.pause();
       el.currentTime=0;
       const result=el.play();
       if(result && typeof result.catch==='function'){
         result.catch(()=>this.playTone(type));
       }
       return true;
     }catch(_){
       return this.playTone(type);
     }
   }

   return this.playTone(type);
 }
};

// Soft UI click SFX (very short + quiet). Respects sfxEnabled.
// --- Helpers: UI click SFX, subtle haptics, playfield guard ---

function playUiClick(){
  if (!sfxEnabled) return;

  const el = audioManager.elements.move;
  if (!el) return;

  try{
    el.pause();
    el.currentTime = 0;
    const promise = el.play();
    if (promise && typeof promise.catch === 'function') promise.catch(()=>{});
  }catch(_){}
}

function doHaptics(isCorrect){
  if (!('vibrate' in navigator) || !sfxEnabled) return;
  try{
    if (isCorrect) navigator.vibrate(12);
    else navigator.vibrate([18, 10, 18]);
  }catch(_){}
}

function isInsidePlayfield(x, y){
  const game   = document.getElementById('game');
  const header = document.getElementById('header');
  const footer = document.getElementById('footer');
  if (!game) return false;
  const g  = game.getBoundingClientRect();
  const hb = header ? header.getBoundingClientRect().bottom : g.top;
  const ft = footer ? footer.getBoundingClientRect().top    : g.bottom;
  return x >= g.left && x <= g.right && y >= hb && y <= ft;
}

// Update HOF texts in-place (returns true if an overlay was found)
function refreshHofTexts(){
  const hof = document.querySelector('.hall-of-fame-overlay');

  const t = translations[currentLang];

  // Title (both variants)
  const isCongrats = !!hof.querySelector('.congratulations');
  const titleEl = hof.querySelector('.hof-title') || hof.querySelector('.hof-content h2');
  if (titleEl) titleEl.textContent = isCongrats ? t.newHighScore : t.hallOfFame;

  // Play again button
  const playBtn = hof.querySelector('#hof-play-again') || hof.querySelector('.hof-content button');
  if (playBtn) playBtn.textContent = t.playAgain;

  // Congrats line + rank (congrats variant only)
  const congrats = hof.querySelector('.congratulations');
  if (congrats) congrats.innerHTML = `<i class="fas fa-trophy"></i> ${t.congratulations} <i class="fas fa-trophy"></i>`;
  const rankEl = Array.from(hof.querySelectorAll('div')).find(d => /#\d+/.test(d.textContent));
  if (rankEl) rankEl.textContent = `${t.rank}: #${highScorePosition + 1}`;

  return true;
}

function changePhaseWithSignal(){

  if(isPaused || phaseChanging) return;

  phaseChanging=true;

  const nextPhase =
    currentPhase==="blue"
      ? "yellow"
      : "blue";

  const t=translations[currentLang];

  /* Remove an old signal if one somehow remains */
  document.querySelectorAll('.phase-change-signal')
    .forEach(el=>el.remove());

  const signal=document.createElement("div");

  signal.className=
    `phase-change-signal ${nextPhase}`;

  signal.textContent =
    nextPhase==="blue"
      ? (currentLang==="MN"
          ? "ХӨХ ОНГОЦ!"
          : "BLUE PLANE!")
      : (currentLang==="MN"
          ? "ШАР ОНГОЦ!"
          : "YELLOW PLANE!");

  document
    .getElementById("game")
    .appendChild(signal);

  /*
    During these 800 ms the old plane is still visible,
    but swipes are ignored.
  */

  setTimeout(()=>{

    signal.remove();

    currentPhase=nextPhase;

    pointingDirection=getRandomDirection();
    movingDirection=getRandomDirection();

    spawnPlanes();

    phaseChanging=false;

  },PHASE_SIGNAL_DURATION);
}


function startTutorialGame(){
 tutorialMode=true; let roundsCompleted=0; const MAX_ROUNDS=2;
 document.getElementById("practice-controls").style.display="block";
 currentPhase="blue"; pointingDirection=getRandomDirection(); movingDirection=getRandomDirection();
 spawnPlanes(); setupTouchControls(); setupDesktopControls(); setupGameControls();
 phaseInterval=setInterval(()=>{
  if(!isPaused && !phaseChanging){

    roundsCompleted++;

    if(roundsCompleted>=MAX_ROUNDS){
      endTutorial();
      return;
    }

    changePhaseWithSignal();
  }
},15000);
}
function endTutorial(){
  clearInterval(phaseInterval); clearInterval(gameInterval); cancelAnimationFrame(animationId);
  if(currentFeedback){clearTimeout(currentFeedback.timeout);currentFeedback.element.remove();currentFeedback=null;}
  document.getElementById("practice-controls").style.display="none"; tutorialMode=false;

  const t=translations[currentLang];
  const ov=document.createElement("div");
  ov.className="completion-overlay";
  ov.innerHTML=`<div class="completion-content">
    <h2>${t.practiceCompleted}</h2>
    <button id="continue-btn">${t.startGame}</button>
  </div>`;

  document.getElementById("game").appendChild(ov);

  document.getElementById("continue-btn").onclick = function(){
    playUiClick();
    ov.remove();
    startMainGame();
  };
}

/* Main Game */
function startMainGame(){
  document.getElementById('game').classList.remove('overlay-open');
  if(currentFeedback){clearTimeout(currentFeedback.timeout);currentFeedback.element.remove();currentFeedback=null;}
  if(activeFeedback){clearTimeout(activeFeedback.timeout);activeFeedback.element.remove();activeFeedback=null;}
  document.querySelectorAll('.feedback-icon').forEach(el=>el.remove());
  tutorialMode=false;
  document.querySelectorAll('.countdown-overlay,.completion-overlay,.hall-of-fame-overlay').forEach(el=>el.remove());

  const btn=document.createElement("div"); btn.id="start-button";
  const t=translations[currentLang]; btn.textContent=t?.tapToStart||"TAP TO START";
  document.getElementById("game").appendChild(btn);

  btn.onclick = function(){
    playUiClick();
    this.remove();
    gameStarted=true;
    updateUIText();
    showInitialCountdown(()=>{
      updateHeader(); spawnPlanes(); startGameLoop();
      setupTouchControls(); setupDesktopControls(); setupGameControls();
    });
  };
}

function setupGameControls(){
 const pause=document.getElementById("pause-btn"), restart=document.getElementById("restart-btn"), home=document.getElementById("home-btn"), end=document.getElementById("end-practice-btn");
 if(pause) pause.onclick=togglePause;
 if(restart) restart.onclick=restartGame;
 if(home) home.onclick=showQuitConfirmation;
 if(end) end.onclick=endTutorial;
}

function returnHome(){
 playUiClick();
 clearInterval(gameInterval); clearInterval(phaseInterval); cancelAnimationFrame(animationId);
 gameStarted=false; isPaused=false; tutorialMode=false; phaseChanging=false; handlingSwipe=false;
 if(currentFeedback){clearTimeout(currentFeedback.timeout);currentFeedback.element.remove();currentFeedback=null;}
 if(activeFeedback){clearTimeout(activeFeedback.timeout);activeFeedback.element.remove();activeFeedback=null;}
 document.querySelectorAll('.feedback-icon,.countdown-overlay,.completion-overlay,.hall-of-fame-overlay,#start-button,#quit-confirm-overlay').forEach(el=>el.remove());
 const pc=document.getElementById('practice-controls'); if(pc) pc.style.display='none';
 const rc=document.getElementById('round-counter'); if(rc) rc.style.display='none';
 const pause=document.getElementById('pause-btn'); if(pause) pause.textContent='⏸';
 document.getElementById('game').classList.remove('overlay-open');
 showWelcomeScreen();
}

function showQuitConfirmation(){
 playUiClick();
 if(document.getElementById('quit-confirm-overlay')) return;
 const wasPaused=isPaused;
 if(gameStarted && !isPaused){ isPaused=true; cancelAnimationFrame(animationId); }
 const t=translations[currentLang];
 const ov=document.createElement('div');
 ov.id='quit-confirm-overlay'; ov.className='completion-overlay';
 ov.innerHTML=`<div class="completion-content quit-card"><h2>${t.quitTitle}</h2><p>${t.quitMessage}</p><div class="quit-actions"><button id="quit-cancel">${t.cancel}</button><button id="quit-ok">${t.quit}</button></div></div>`;
 document.getElementById('game').appendChild(ov);
 document.getElementById('quit-cancel').onclick=()=>{playUiClick();ov.remove();if(gameStarted && !wasPaused){isPaused=false;animateMovement();}};
 document.getElementById('quit-ok').onclick=returnHome;
}
function togglePause(){isPaused=!isPaused;document.getElementById("pause-btn").textContent=isPaused?"▶":"⏸";if(isPaused)cancelAnimationFrame(animationId);else animateMovement();}
function restartGame(){
 document.getElementById('game').classList.remove('overlay-open');
 if(currentFeedback){clearTimeout(currentFeedback.timeout);currentFeedback.element.remove();currentFeedback=null;}
 if(activeFeedback){clearTimeout(activeFeedback.timeout);activeFeedback.element.remove();activeFeedback=null;}
 document.querySelectorAll('.feedback-icon').forEach(el=>el.remove());
 document.querySelectorAll('.countdown-overlay,.completion-overlay,.hall-of-fame-overlay').forEach(el=>el.remove());
 if(tutorialMode) document.getElementById("practice-controls").style.display="block";

 scoreMeter=0; scoreMultiplier=1;
 clearInterval(gameInterval); clearInterval(phaseInterval); cancelAnimationFrame(animationId);
 isPaused=false; score=0; timeLeft=60; currentPhase="blue"; pointingDirection="→"; movingDirection="↓";
 document.getElementById("pause-btn").textContent="⏸"; updateHeader(); updateFooter();

 if(tutorialMode) startTutorialGame(); else { spawnPlanes(); startGameLoop(); }
}

/* Spawning & animation */
function spawnPlanes(){
 if (activeFeedback && !tutorialMode) {
    activeFeedback.element.remove();
    clearTimeout(activeFeedback.timeout);
    activeFeedback = null;}
 const c=document.getElementById("planes-container"); c.innerHTML=''; c.style.transform='translate(-50%,-50%)';
 if(currentPhase==="blue"){document.getElementById("pointing-label").style.backgroundColor="rgba(30,136,229,.3)";document.getElementById("moving-label").style.backgroundColor="rgba(255,214,0,.1)";}
 else{document.getElementById("pointing-label").style.backgroundColor="rgba(30,136,229,.1)";document.getElementById("moving-label").style.backgroundColor="rgba(255,214,0,.3)";}
 [{top:-40,left:0},{top:40,left:-40},{top:40,left:40}].forEach(p=>{
   const img=document.createElement("img"); img.className="plane"; img.src=planeImages[currentPhase];
   img.style.top=`${p.top}px`; img.style.left=`${p.left}px`; img.style.transform=`rotate(${getAngle(pointingDirection)}deg)`; c.appendChild(img);
 });
 updateFooter(); if(animationId) cancelAnimationFrame(animationId); animateMovement();
}
function getAngle(d){return d==="→"?0:d==="↓"?90:d==="←"?180:270;}
function animateMovement(){
 const container=document.getElementById("planes-container");
 const gameArea=document.getElementById("game");
 const r=gameArea.getBoundingClientRect(),planeSize=60,speed=2;
 let x=r.width/2,y=r.height/2,moveX=0,moveY=0;
 switch(movingDirection){case"→":moveX=speed;break;case"←":moveX=-speed;break;case"↑":moveY=-speed;break;default:moveY=speed;}
 function move(){
   if(!isPaused){
     x+=moveX;y+=moveY;
     if(x<planeSize/2||x>r.width-planeSize/2){moveX*=-1;movingDirection=moveX>0?"→":"←";updateFooter();}
     if(y<planeSize/2||y>r.height-planeSize/2){moveY*=-1;movingDirection=moveY>0?"↓":"↑";updateFooter();}
     container.style.transform=`translate(calc(-50% + ${x-r.width/2}px), calc(-50% + ${y-r.height/2}px))`;
   }
   animationId=requestAnimationFrame(move);
 }
 move();
}
function updateHeader(){
 const t=translations[currentLang];
 document.getElementById("time").textContent=`${t.time} 0:${timeLeft<10?'0'+timeLeft:timeLeft}`;
 document.getElementById("score").textContent=`${t.score} ${score}`;
 const meter=document.getElementById('score-meter'); if(meter) meter.textContent=`${scoreMeter}/${METER_REQUIREMENT} ×${scoreMultiplier}`;
}
function updateFooter(){document.getElementById("pointing").textContent=pointingDirection;document.getElementById("moving").textContent=movingDirection;}

/* Loop & countdowns */
function startGameLoop(){
 if(gameInterval) clearInterval(gameInterval);
 if(phaseInterval) clearInterval(phaseInterval);
 gameInterval=setInterval(()=>{if(!isPaused){timeLeft--;updateHeader();if(timeLeft===5)showWarningCountdown();if(timeLeft<=0){clearInterval(gameInterval);clearInterval(phaseInterval);cancelAnimationFrame(animationId);showEndCountdown();}}},1000);
 phaseInterval=setInterval(()=>{
  if(!isPaused && !phaseChanging){
    changePhaseWithSignal();
  }
},15000);
}
function showInitialCountdown(cb){
 let count=3; const ov=document.createElement("div"); ov.className="countdown-overlay";
 const t=translations[currentLang]; ov.textContent=count; document.getElementById("game").appendChild(ov);
 const i=setInterval(()=>{count--;ov.textContent=count>0?count:(t.go||"GO!");if(count<=0){clearInterval(i);audioManager.play("go");ov.style.animation="zoomIn .5s";setTimeout(()=>{ov.remove();cb();},1000);}else audioManager.play("countdown");},1000);
}
function showWarningCountdown(){const el=document.getElementById("time");el.style.color="red";el.style.animation="pulse .5s infinite";audioManager.play("warning");}
function showEndCountdown(){
  document.querySelectorAll('.completion-overlay,.hall-of-fame-overlay').forEach(el=>el.remove());

  const bonus=250*scoreMultiplier, baseScore=score-bonus;
  const ov=document.createElement("div");
  ov.className="completion-overlay";
  const t=translations[currentLang];

  ov.innerHTML=`<div style="text-align:center;padding:20px;">
    <h2 style="font-size:28px;margin-bottom:20px;color:#1e88e5;">${t.timeUp}</h2>
    <p style="font-size:20px;margin-bottom:10px;">${t.finalScore} ${baseScore}</p>
    <p style="font-size:16px;margin-bottom:10px;color:#4CAF50;">+${bonus} ${t.bonus} (×${scoreMultiplier})</p>
    <p style="font-size:20px;margin-bottom:30px;font-weight:bold;">${t.totalScore}: ${score}</p>
    <button class="play-again-btn" id="play-again-button" style="pointer-events:auto!important;">${t.close}</button>
  </div>`;

  document.getElementById("game").appendChild(ov);
  document.getElementById('game').classList.add('overlay-open');
  window.currentEndOverlay = ov;

  document.getElementById('play-again-button').onclick = function(){
    playUiClick();
    ov.remove();
    showHallOfFame(score);
  };
}

/* Input handling */
function getRandomDirection(){return ["→","↓","←","↑"][Math.floor(Math.random()*4)];}

/* Lock the intended answer when a gesture begins so a moving yellow plane
   cannot reverse at an edge halfway through the user's swipe. */
function getCurrentSwipeTarget(){
  const opposites={"→":"←","←":"→","↑":"↓","↓":"↑"};
  return currentPhase==="blue" ? opposites[pointingDirection] : movingDirection;
}

/* Touch (added once) */
function setupTouchControls(){
  if (touchControlsInitialized) return;
  touchControlsInitialized = true;

  let sx=null, sy=null, uiTouch=false;
let swipeActive=false;
document.addEventListener('touchcancel', () => {
  sx=null;
  sy=null;
  uiTouch=false;
  swipeActive=false;
});
swipeActive=true;
  let lockedSwipeTarget = null;
  const MIN_SWIPE = 24;

  const UI_SELECTOR = [
    '#start-button','#welcome-screen','#continue-btn',
    '.completion-overlay','.hall-of-fame-overlay','#tutorial-screen',
    '#controls','#practice-controls','#language-btn','#sfx-btn','#help-btn'
  ].join(',');

  document.addEventListener('touchstart', (e) => {
    if (e.touches.length > 1) return;     // ignore multi-touch
    uiTouch = !!e.target.closest(UI_SELECTOR);
    if (uiTouch) { sx = sy = null; lockedSwipeTarget = null; return; }

    const x = e.touches[0].clientX, y = e.touches[0].clientY;
    if (!isInsidePlayfield(x, y)) {        // must start in playfield
      sx = sy = null; lockedSwipeTarget = null; uiTouch = true; 
      return;
    }
    sx = x; sy = y;
    lockedSwipeTarget = getCurrentSwipeTarget();
  }, { passive:true });
  document.addEventListener('touchmove', (e) => {
  if (!swipeActive) return;

  /*
    Critical:
    stop Chrome/Samsung Internet from turning our game swipe
    into page scrolling or pull-to-refresh.
  */
  e.preventDefault();

}, { passive:false });

  document.addEventListener('touchend', (e) => {
    if (uiTouch || sx==null || sy==null) { uiTouch=false; lockedSwipeTarget=null; return; }

    const ex = e.changedTouches[0].clientX;
    const ey = e.changedTouches[0].clientY;
    const dx = ex - sx, dy = ey - sy;
    sx = sy = null; uiTouch=false;

    if (Math.hypot(dx, dy) < MIN_SWIPE) { lockedSwipeTarget=null; return; } // ignore taps

    const dir = Math.abs(dx) > Math.abs(dy)
      ? (dx > 0 ? "→" : "←")
      : (dy > 0 ? "↓" : "↑");

    checkSwipe(dir, lockedSwipeTarget);
    lockedSwipeTarget = null;
  });
}

/* Desktop mouse + keyboard */
function setupDesktopControls(){
  if(desktopControlsInitialized) return;
  desktopControlsInitialized = true;

  // Mouse swipe
  let md=false, mx=0, my=0, mouseSwipeTarget=null;
  document.addEventListener('mousedown', e=>{
    if (e.target.closest('#controls, #welcome-screen, .completion-overlay, .hall-of-fame-overlay, #tutorial-screen, #practice-controls'))
      return;
    if (!isInsidePlayfield(e.clientX, e.clientY)) return;
    md=true; mx=e.clientX; my=e.clientY;
    mouseSwipeTarget=getCurrentSwipeTarget();
  });
  document.addEventListener('mouseup', e=>{
    if(!md) return; md=false;
    const dx=e.clientX-mx, dy=e.clientY-my;
    if(Math.hypot(dx,dy) < 20){ mouseSwipeTarget=null; return; }
    const dir = Math.abs(dx)>Math.abs(dy) ? (dx>0?"→":"←") : (dy>0?"↓":"↑");
    checkSwipe(dir, mouseSwipeTarget);
    mouseSwipeTarget=null;
  });

  // Arrow keys
  document.addEventListener('keydown', e=>{
    const k=e.key;
    if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"].includes(k)){
      e.preventDefault();
      const dir = k==="ArrowLeft"?"←" : k==="ArrowRight"?"→" : k==="ArrowUp"?"↑" : "↓";
      checkSwipe(dir);
    }
  });
}

/* Feedback renderers */
function showSwipeFeedback(isCorrect){ // BIG centered (practice)
 document.querySelectorAll('.feedback-icon').forEach(el=>el.remove());
 if(activeFeedback){clearTimeout(activeFeedback.timeout);activeFeedback=null;}
 const el=document.createElement("div");
 el.className="feedback-icon";
 el.innerHTML=isCorrect?`<i class="fas fa-check"></i>`:`<i class="fas fa-times"></i>`;
 document.getElementById("game").appendChild(el);
 activeFeedback={element:el,timeout:setTimeout(()=>{el.remove();activeFeedback=null;},1000)};
}
function showMeterFeedback(isCorrect){ // tiny near meter (main)
 document.querySelectorAll('.meter-feedback').forEach(n=>n.remove());
 const header=document.getElementById('header'), meter=document.getElementById('score-meter');
 const h=header.getBoundingClientRect(), m=meter.getBoundingClientRect();
 const badge=document.createElement('div'); badge.className='meter-feedback';
 badge.style.color=isCorrect?'#10B981':'#EF4444'; badge.textContent=isCorrect?'✓':'✕';
 badge.style.left=(m.left-h.left + m.width/2)+'px';
 badge.style.top=(m.top-h.top + 6)+'px';
 header.appendChild(badge);
 setTimeout(()=>badge.remove(),700);
}
function renderFeedback(isCorrect){
  if (!tutorialMode) {
    if (sfxEnabled) audioManager.play(isCorrect ? 'correct' : 'incorrect');
    doHaptics(isCorrect);
    showMeterFeedback(isCorrect);
  } else {
    showSwipeFeedback(isCorrect);
  }
}

/* Swipe logic */
function checkSwipe(swipeDir, lockedTarget=null){
  if(phaseChanging) return;
 const target = lockedTarget || getCurrentSwipeTarget();
 const isCorrect = swipeDir===target;

 renderFeedback(isCorrect);

 if(!tutorialMode && isCorrect){
   const pts=BASE_POINTS*scoreMultiplier; score+=pts; scoreMeter++;
   if(scoreMeter>=METER_REQUIREMENT){ if(scoreMultiplier<MAX_MULTIPLIER) scoreMultiplier++; scoreMeter=0; }
   updateHeader();
 }else if(!tutorialMode){
   if(scoreMeter>0) scoreMeter=0; else if(scoreMultiplier>1) scoreMultiplier--;
   updateHeader();
 }

 document.body.style.backgroundColor=isCorrect?"#e8f5e9":"#ffebee";
 setTimeout(()=>{document.body.style.backgroundColor="#f0f8ff";},200);

 if(isCorrect){
   pointingDirection=getRandomDirection();
   movingDirection=getRandomDirection();
   spawnPlanes();
 }
}
// mark desktop once and on resize so the CSS above activates
function applyDesktopClass(){
  const desktop = window.matchMedia('(hover:hover) and (pointer:fine)').matches || window.innerWidth >= 1000;
  document.documentElement.classList.toggle('is-desktop', desktop);
}
applyDesktopClass();
window.addEventListener('resize', applyDesktopClass);

/* Boot */
window.addEventListener('DOMContentLoaded',()=>{
 // Don’t auto-open tutorial; hide it if CSS showed it
 const tut=document.getElementById('tutorial-screen'); if(tut) tut.style.display='none';
 audioManager.init();
 updateUIText();
 initLanguageButton();
 initSfxButton();
 initHelpButton();
 addTutorialCloseButton();
 showWelcomeScreen();
 refreshHofTexts();
});

</script>

<!-- ===== PWA Enhancements (installed/updates/iOS tip) ===== -->
<script>
// Service Worker registration + update banner
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').then(reg => {
    reg.addEventListener('updatefound', () => {
      const newWorker = reg.installing;
      newWorker.addEventListener('statechange', () => {
        if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
          showUpdateBanner();
        }
      });
    });
  });
}

function showUpdateBanner() {
  const banner = document.createElement('div');
  banner.style.cssText = `
    position:fixed;bottom:0;left:0;right:0;z-index:5000;
    background:#1e88e5;color:#fff;text-align:center;
    padding:12px;font-size:16px;font-weight:bold;
    box-shadow:0 -2px 8px rgba(0,0,0,0.25);`;
  banner.textContent = 'A new version is available!';
  const btn = document.createElement('button');
  btn.textContent = 'Refresh';
  btn.style.cssText = `
    margin-left:15px;padding:6px 14px;border:none;
    border-radius:20px;background:#ffd600;color:#000;
    font-weight:bold;cursor:pointer;`;
  btn.onclick = () => {
    navigator.serviceWorker.getRegistration().then(reg => {
      if (reg && reg.waiting) reg.waiting.postMessage({ action: 'skipWaiting' });
      window.location.reload();
    });
  };
  banner.appendChild(btn);
  document.body.appendChild(banner);
}
if (navigator.serviceWorker) {
  navigator.serviceWorker.addEventListener('controllerchange', () => window.location.reload());
}

// Android “Install” button in your #controls
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  const controls = document.getElementById('controls');
  if (controls && !document.getElementById('install-btn')) {
    const b = document.createElement('button');
    b.id = 'install-btn';
    b.textContent = '⤓';
    b.title = 'Install';
    b.style.cssText = 'padding:2px 8px;font-size:12px;margin-left:8px;';
    b.onclick = async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      b.remove();
    };
    controls.appendChild(b);
  }
});

// iOS Add-to-Home-Screen tip (shown once)
function showIOSTipOnce() {
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
  if (isIOS && !isStandalone && !localStorage.getItem('iosTipShown')) {
    const tip = document.createElement('div');
    tip.style.cssText = `
      position:absolute;left:0;right:0;top:55px;z-index:1500;
      margin:0 10px;padding:10px 12px;border-radius:10px;
      background:#111827e6;color:#fff;font-size:14px;text-align:center`;
    tip.innerHTML = '📱 iPhone дээр суулгахын тулд <b>Share</b> → <b>Add to Home Screen</b> дарна уу.';
    document.getElementById('game').appendChild(tip);
    setTimeout(()=>tip.remove(), 6000);
    localStorage.setItem('iosTipShown','1');
  }
}
window.addEventListener('DOMContentLoaded', showIOSTipOnce);
</script>
